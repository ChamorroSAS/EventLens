<div class="console-shell admin-console-shell" [class.sidebar-is-collapsed]="isSidebarCollapsed()">
  <header class="shell-header" role="banner">
    <div class="shell-container header-inner">
      <div class="brand-area">
        <a
          [href]="eventsPath"
          (click)="onNavigate($event, eventsPath)"
          class="brand-link"
          aria-label="Ir a la consola administrativa de Phoeve">
          <div class="brand-title">
            @if (!logoFailed) {
            <img
              src="assets/branding/phoeve/logo-primary.png"
              alt="Phoeve"
              class="brand-logo"
              width="105"
              height="35"
              (error)="onLogoError()" />
            } @else {
            <span class="brand-fallback-text">Phoeve</span>
            }
          </div>
        </a>
        <span class="brand-badge">Administrador</span>

        <button
          type="button"
          class="btn-sidebar-toggle"
          (click)="toggleSidebar()"
          aria-label="Alternar menú lateral">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="shell-container shell-layout">
    <aside class="shell-sidebar" aria-label="Menú principal de administración">
      <div class="sidebar-card">
        <!-- Profile Info Card -->
        <div class="sidebar-profile-card">
          <div class="sidebar-avatar-wrap">
            <div class="sidebar-avatar-fallback">{{ userInitial() }}</div>
          </div>
          <div class="sidebar-user-details">
            <span class="sidebar-user-greeting">Consola administrativa</span>
            <span class="sidebar-user-email" [title]="userIdentifier()">
              {{ userIdentifier() || 'administrador' }}
            </span>
          </div>
        </div>

        <!-- Main Navigation -->
        <nav class="sidebar-nav">
          <a
            [href]="organizersPath"
            class="sidebar-nav-item"
            [class.is-active]="activeNav === 'organizadores'"
            (click)="onNavigate($event, organizersPath)"
            aria-label="Ir a Organizadores"
            data-testid="sidebar-nav-organizers">
            <span class="nav-item-content">
              <span class="nav-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </span>
              <span class="nav-label">Organizadores</span>
            </span>
          </a>

          <a
            [href]="eventsPath"
            class="sidebar-nav-item"
            [class.is-active]="activeNav === 'eventos'"
            (click)="onNavigate($event, eventsPath)"
            aria-label="Ir a Eventos"
            data-testid="sidebar-nav-events">
            <span class="nav-item-content">
              <span class="nav-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </span>
              <span class="nav-label">Eventos</span>
            </span>
          </a>
        </nav>

        <!-- Bottom Action: Cerrar sesión -->
        <div class="sidebar-footer">
          <button
            type="button"
            class="sidebar-logout-btn"
            (click)="onLogout()"
            aria-label="Cerrar sesión">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>
    </aside>

    <main id="main-content" class="shell-main" role="main">
      <ng-content></ng-content>
    </main>
  </div>

  <footer class="shell-footer" role="contentinfo">
    <div class="shell-container footer-inner">
      <p class="footer-text">Phoeve BETA — Consola administrativa.</p>
    </div>
  </footer>
</div>
