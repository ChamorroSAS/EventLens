name: eventlens-spikes-059-restore
services:
  postgres-restore:
    image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment: {POSTGRES_DB: eventlens_lab, POSTGRES_USER: lab_admin, POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin}
    secrets: [pg_admin]
    volumes: [pg_restore:/var/lib/postgresql/data]
    networks: [restore]
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U lab_admin -d eventlens_lab'], interval: 3s, timeout: 3s, retries: 40}
  minio-restore:
    image: eventlens-spikes-minio:2025-10-15-9e49d5e
    environment: {MINIO_ROOT_USER_FILE: /run/secrets/s3_root_user, MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_root_password}
    secrets: [s3_root_user, s3_root_password]
    volumes: [s3_restore:/data]
    networks: [restore]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    healthcheck: {test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/ready], interval: 3s, timeout: 3s, retries: 40}
  restore-check:
    image: eventlens-spikes-harness:059
    environment: {RESTORE: 'true'}
    command: [node, src/persistence.mjs]
    secrets: [pg_admin, s3_lab_user, s3_lab_password]
    volumes: ['./evidence:/evidence']
    networks: [restore]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1
    mem_limit: 512m
volumes:
  pg_restore:
  s3_restore:
networks:
  restore: {internal: true}
secrets:
  pg_admin: {file: ./.local/secrets/pg_admin}
  s3_root_user: {file: ./.local/secrets/s3_root_user}
  s3_root_password: {file: ./.local/secrets/s3_root_password}
  s3_lab_user: {file: ./.local/secrets/s3_lab_user}
  s3_lab_password: {file: ./.local/secrets/s3_lab_password}
