name: Deploy Beta

# Publishes a new image pair on the closed Beta host.
#
# Controls, in order:
#   1. Manual dispatch only, and the request must be confirmed by typing exactly
#      "deploy".
#   2. The job runs in the protected `beta` GitHub environment. An environment
#      applies the pause before the job starts and, when required reviewers are
#      configured, it also requires their approval; without them the pause is the
#      only effect. See docs/aws-preview-deployment.md for what the environment
#      does and does not enforce.
#   3. Images must be digest-pinned: a tag can be moved, a digest cannot.
#   4. The workflow can only invoke the restricted SSM document
#      `phoeve-beta-deploy` (infra/terraform/modules/identity), which accepts a
#      validated action and, for a deployment, a digest-pinned image pair. It
#      cannot run arbitrary commands: no shell document is permitted, by the
#      document and by the role policy.
#   5. The entry point validates the contract and the runtime probe, and rolls
#      back on failure.
#
# GitHub holds no AWS keys: it exchanges an OIDC token for a short-lived session.

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: 'API image, digest-pinned (for example ghcr.io/acme/phoeve-api@sha256:...)'
        required: true
        type: string
      web_image:
        description: 'SPA image, digest-pinned'
        required: true
        type: string
      confirmation:
        description: 'Type deploy to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to beta.phoeve.com
    runs-on: ubuntu-latest
    environment: beta
    env:
      AWS_REGION: ${{ vars.PHOEVE_AWS_REGION }}
      API_IMAGE: ${{ inputs.api_image }}
      WEB_IMAGE: ${{ inputs.web_image }}
      # The only document the deploy role can send commands to. It is created by
      # infra/terraform/modules/identity and cannot run a caller-supplied script.
      SSM_DOCUMENT: phoeve-beta-deploy
    steps:
      - name: Verify the request
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "deploy" ]; then
            echo "::error::the confirmation input must be exactly 'deploy'"
            exit 1
          fi
          # The same shape the SSM document enforces, so a bad reference is
          # rejected here instead of by the host.
          pinned='^[a-z0-9][a-z0-9._/:-]*@sha256:[0-9a-f]{64}$'
          for ref in "$API_IMAGE" "$WEB_IMAGE"; do
            if ! printf '%s' "$ref" | grep -qE "$pinned"; then
              echo "::error::image reference '$ref' is not a digest-pinned reference"
              exit 1
            fi
          done
          if [ -z "${AWS_REGION:-}" ]; then
            echo "::error::the PHOEVE_AWS_REGION repository variable is not set"
            exit 1
          fi
          echo "request verified"

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PHOEVE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: phoeve-beta-deploy

      - name: Resolve the Beta host
        id: host
        run: |
          set -euo pipefail
          ids=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=phoeve" \
              "Name=tag:Environment,Values=beta" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          count=$(echo "$ids" | wc -w | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one running Beta host, found $count"
            exit 1
          fi
          echo "instance_id=$ids" >> "$GITHUB_OUTPUT"
          echo "target: $ids"

      - name: Run the deployment entry point
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
        run: |
          set -euo pipefail
          parameters=$(jq -nc \
            --arg action deploy \
            --arg api "$API_IMAGE" \
            --arg web "$WEB_IMAGE" \
            '{action: [$action], apiImage: [$api], webImage: [$web]}')
          command_id=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --comment "phoeve beta deploy" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          echo "command: $command_id"

          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "attempt $attempt: $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json | tee invocation.json

          final=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          if [ "$final" != "Success" ]; then
            echo "::error::the deployment entry point did not succeed ($final)"
            exit 1
          fi

      - name: Verify the published surface
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
        run: |
          set -euo pipefail
          # The entry point runs the bundle's own contract probe against the
          # published origin, in the image that is actually serving it.
          parameters=$(jq -nc --arg action verify '{action: [$action]}')
          command_id=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --comment "phoeve beta verify" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                echo "::error::the published-surface probe failed"
                exit 1
                ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json

          final=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          if [ "$final" != "Success" ]; then
            echo "::error::the published-surface probe did not succeed ($final)"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Beta deployment"
            echo
            echo "- API image: \`$API_IMAGE\`"
            echo "- SPA image: \`$WEB_IMAGE\`"
            echo "- Host: \`${{ steps.host.outputs.instance_id }}\`"
            echo "- Document: \`$SSM_DOCUMENT\`"
            echo
            echo "The host performs its own contract check, activates only when the"
            echo "database schema is known, probes the published surface and rolls"
            echo "back to the previous release when that probe fails."
          } >> "$GITHUB_STEP_SUMMARY"
