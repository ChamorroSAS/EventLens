name: eventlens-development
x-workspace: &workspace
  image: eventlens-development:workspace
  build:
    context: .
    dockerfile: infra/development/Dockerfile
    target: workspace
  init: true
  mem_limit: 2g
  cpus: 2
  pids_limit: 256
  security_opt: [no-new-privileges:true]
x-database: &database
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-eventlens}
  PGPASSWORD: ${POSTGRES_PASSWORD:-eventlens-local-only}
  PGDATABASE: ${POSTGRES_DB:-eventlens}
  DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-2000}
services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventlens-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-eventlens}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: eventlens-development:minio
    build:
      context: .
      dockerfile: infra/spikes/Dockerfile.minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eventlens-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eventlens-local-storage-only}
    ports: ["127.0.0.1:${MINIO_PORT:-19000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"]
    volumes: ["objects-data:/data"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *workspace
    environment: *database
    command: ["node", "scripts/database.mjs", "migrate"]
    depends_on:
      postgres: {condition: service_healthy}
  media-init:
    <<: *workspace
    environment:
      <<: *database
      NODE_ENV: development
      LOCAL_MEDIA_UPLOAD_ENABLED: ${LOCAL_MEDIA_UPLOAD_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-eventlens}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eventlens-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eventlens-local-storage-only}
    command: ["node", "scripts/local-media.mjs"]
    depends_on:
      minio: {condition: service_healthy}
  api:
    <<: *workspace
    environment:
      <<: *database
      API_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-4200}}
      PUBLIC_ENTRY_BASE_URL: ${PUBLIC_ENTRY_BASE_URL:-http://localhost:${WEB_PORT:-4200}}
      NODE_ENV: development
      LOCAL_ADMIN_ENABLED: ${LOCAL_ADMIN_ENABLED:-false}
      LOCAL_ADMIN_AUTHORITY_DIR: /home/node/.eventlens/admin-authority
      LOCAL_MEDIA_UPLOAD_ENABLED: ${LOCAL_MEDIA_UPLOAD_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-eventlens}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eventlens-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eventlens-local-storage-only}
    volumes: ["admin-authority:/home/node/.eventlens/admin-authority"]
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      media-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped
  web:
    <<: *workspace
    environment:
      API_PROXY_TARGET: http://api:3000
      STORAGE_PROXY_TARGET: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-eventlens}
      NG_CLI_ANALYTICS: "false"
    command: ["pnpm", "--filter", "@eventlens/web", "start", "--port", "4200"]
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-4200}:4200"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      start_period: 40s
      retries: 20
    restart: unless-stopped
  tools:
    <<: *workspace
    profiles: ["tools"]
    environment: *database
    command: ["node", "scripts/workspace.mjs", "test"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  local-admin:
    <<: *workspace
    profiles: ["tools"]
    environment:
      <<: *database
      NODE_ENV: development
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-4200}}
    volumes:
      - ./.env:/operator/local.env
      - admin-authority:/home/node/.eventlens/admin-authority
    command: ["node", "scripts/local-admin.mjs", "bootstrap"]
  contracts:
    <<: *workspace
    profiles: ["tools"]
    # Export only: Docker Desktop host mounts are root-owned. This helper
    # neither regenerates Prisma nor compiles workspace packages.
    user: "0:0"
    cap_add: [DAC_OVERRIDE]
    volumes:
      - ./contracts:/workspace/contracts
      - ./packages/api-client/src:/workspace/packages/api-client/src
    command: ["node", "scripts/workspace.mjs", "client"]
  e2e:
    <<: *workspace
    image: eventlens-development:browser
    build:
      context: .
      dockerfile: infra/development/Dockerfile
      target: browser
    profiles: ["tools"]
    environment:
      WEB_BASE_URL: http://web:4200
      API_BASE_URL: http://api:3000
    command: ["node", "scripts/workspace.mjs", "e2e"]
    depends_on:
      web: {condition: service_healthy}
volumes:
  admin-authority:
  postgres-data:
  objects-data:
